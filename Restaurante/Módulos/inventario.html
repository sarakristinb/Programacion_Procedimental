<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
    <link rel="stylesheet" href="../css/inventario.css">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <title>Inventario</title>
</head>
<body>
<nav class="navbar is-warning" role="navigation" aria-label="main navigation">
      <div class="navbar-brand">
        <a class="navbar-item has-text-weight-bold"> Macdonitas </a>
      </div>

      <div id="navbarBasicExample" class="navbar-menu" color="#0091bd">
        <div class="navbar-start">
          <a class="navbar-item" href="../index.html"> Inicio </a>
          <a class="navbar-item" href="../Módulos/menu.html"> Menú </a>
          <a class="navbar-item" href="../Módulos/quienes_somos.html"> Quienes Somos </a>
          <a class="navbar-item" href="../Módulos/pedidos.html"> Pedidos </a>    
          <a class="navbar-item" href="../Módulos/usuario.html"> Usuario </a>
          <a class="navbar-item" href="../Módulos/contabilidad.html"> Contabilidad </a>  
        </div>
        </div>
      </div>
    </nav>

<section class="section">
    <div class="container">
        <div class="box">
            <h2 class="title is-3 has-text-centered">Registro de Inventario</h2>
            <p class="has-text-centered mb-5">Ingresa los detalles del producto para agregarlo al inventario.</p>

            <div class="field">
              <label class="label">Código Producto</label>
              <div class="control">
                <input class="input" type="number" id="codigo" placeholder="Ejemplo: 12345">
              </div>
            </div>

            <div class="field">
              <label class="label">Nombre Producto</label>
              <div class="control has-icons-left has-icons-right">
                <input class="input is-success" type="text" id="nombre" placeholder="Ejemplo: Coca-Cola">
                <span class="icon is-small is-left">
                  <i class="fas fa-shopping-bag"></i>
                </span>
                <span class="icon is-small is-right">
                  <i class="fas fa-check"></i>
                </span>
              </div>
            </div>

            <div class="field">
              <label class="label">Cantidad</label>
              <div class="control has-icons-left has-icons-right">
                <input class="input is-danger" type="number" id="cantidad" placeholder="Ejemplo: 100">
                <span class="icon is-small is-left">
                  <i class="fas fa-layer-group"></i>
                </span>
                <span class="icon is-small is-right">
                  <i class="fas fa-exclamation-triangle"></i>
                </span>
              </div>
            </div>

            <div class="field">
              <label class="label">Marca Producto</label>
              <div class="control has-icons-left has-icons-right">
                <input class="input is-success" type="text" id="marca" placeholder="Ejemplo: Coca-Cola">
                <span class="icon is-small is-left">
                  <i class="fas fa-copyright"></i>
                </span>
                <span class="icon is-small is-right">
                  <i class="fas fa-check"></i>
                </span>
              </div>
            </div>

            <div class="field is-grouped is-justify-content-center mt-5">
              <div class="control">
                <button type="button" class="button is-link" onclick="guardarInventario(event)" id="guardar">
                    Guardar
                </button>
              </div>
              <div class="control">
                <button class="button is-link is-light">Cancelar</button>
              </div>
            </div>

            <center class="mt-4">
              <div class="control">
                <a href="../index.html" class="button is-warning is-medium">
                  Ir al inicio
                </a>
              </div>
            </center>
        </div>
    </div>
</section>

<script src="../js/inventario.js"></script>
</body>
</html>
