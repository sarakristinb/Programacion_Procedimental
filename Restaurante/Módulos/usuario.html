<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
    <title>Usuario</title>
</head>
<body>
<div class="field">
  <label class="label">Nombre</label>
  <div class="control">
    <input class="input" type="text">
  </div>
</div>

<div class="field">
  <label class="label">Apellido</label>
  <div class="control has-icons-left has-icons-right">
    <input class="input is-success" type="text">
    <span class="icon is-small is-left">
      <i class="fas fa-user"></i>
    </span>
    <span class="icon is-small is-right">
      <i class="fas fa-check"></i>
    </span>
  </div>
</div>

<div class="field">
  <label class="label">Tipo de documento</label>
  <div class="control">
    <div class="select">
      <select>
        <option>Cédula ciudadania</option>
        <option>Cédula extranjería</option>
        <option>Pasaporte</option>
      </select>
    </div>
  </div>
</div>

<div class="field">
  <label class="label">Número de Documento</label>
  <div class="control has-icons-left has-icons-right">
    <input class="input is-danger" type="tel">
    <span class="icon is-small is-left">
      <i class="fas fa-id-card"></i>
    </span>
    <span class="icon is-small is-right">
      <i class="fas fa-exclamation-triangle"></i>
    </span>
  </div>
</div>

<div class="field">
  <label class="label">Teléfono</label>
  <div class="control has-icons-left has-icons-right">
    <input class="input is-danger" type="tel">
    <span class="icon is-small is-left">
      <i class="fas fa-phone"></i>
    </span>
    <span class="icon is-small is-right">
      <i class="fas fa-exclamation-triangle"></i>
    </span>
  </div>
</div>

<div class="field">
  <label class="label">Correo electrónico</label>
  <div class="control has-icons-left has-icons-right">
    <input class="input is-danger" type="email">
    <span class="icon is-small is-left">
      <i class="fas fa-envelope"></i>
    </span>
    <span class="icon is-small is-right">
      <i class="fas fa-exclamation-triangle"></i>
    </span>
  </div>
</div>

<div class="field">
  <label class="label">Género</label>
  <div class="control">
    <div class="select">
      <select>
        <option>Femenino</option>
        <option>Masculino</option>
      </select>
    </div>
  </div>
</div>

<div class="field">
  <label class="label">Cargo</label>
  <div class="control">
    <div class="select">
      <select>
        <option>Chef</option>
        <option>Mesero</option>
        <option>Bartender</option>
        <option>Administrador</option>
        <option>Cajero</option>
      </select>
    </div>
  </div>
</div>

<div class="field">
  <label class="label">Fecha de Nacimiento</label>
  <div class="control has-icons-left has-icons-right">
    <input class="input is-success" type="date">
    <span class="icon is-small is-left">
      <i class="fas fa-calendar"></i>
    </span>
    <span class="icon is-small is-right">
      <i class="fas fa-check"></i>
    </span>
  </div>
</div>

<div class="field">
  <label class="label">Contraseña</label>
  <div class="control has-icons-left has-icons-right">
    <input class="input is-success" type="password">
    <span class="icon is-small is-left">
      <i class="fas fa-lock"></i>
    </span>
    <span class="icon is-small is-right">
      <i class="fas fa-check"></i>
    </span>
  </div>
</div>

<div class="field is-grouped">
  <div class="control">
    <button class="button is-link">Enviar</button>
  </div>
  
    <div class="control">
    <button class="button is-link is-light">Cancelar</button>
  </div>
</div>
</body>
</html>
