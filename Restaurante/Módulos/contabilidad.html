<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contabilidad - Macdonitas</title>
    </title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">
    <style>
        .main-wrapper {
            padding: 40px;
        }
        .outline-rect {
            border: 2px solid #000000;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .header-flat {
            background-color: #ffee00;
        }
        .profile-circle-flat {
            width: 150px;
            height: 150px;
            border: 2px solid #4a4a4a;
            margin: 0 auto 20px auto;
            align-items: center;
            justify-content: center;
        }
        .profile-circle-flat img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .name-rect-flat {
            border: 2px solid #4a4a4a;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            background-color: #000000;
            color: #4a4a4a;
        }
        .inner-content-rect {
            border: 2px solid #4a4a4a;
            padding: 2rem;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        
        <div class="outline-rect header-flat">
            <h1 class="title is-3 has-text-centered is-marginless">contabilidad Macdonitas </h1>
        </div>

        <div class="outline-rect">
            <div class="columns">
                
                <div class="column is-4">
                    <div class="p-4">
                        <div class="profile-circle-flat">
                            <img src="https://th.bing.com/th/id/OIP.e7N-igFLaKt3S-JiDBbMrgHaD4?w=200&h=200&c=10&o=6&pid=genserp&rm=2
                            " alt="Avatar">
                        </div>
                        <div class="name-rect-flat">
                            contador contable de Macdonitas
                        </div>
                    </div>
                </div>

                <div class="column is-8">
                    <div class="p-4">
                        <div class="inner-content-rect">
                            <div class="columns is-multiline">
                                <div class="column is-6">
                                    <div class="field">
                                        <label class="label">Ventas</label>
                                        <div class="control">
                                            <input class="input" type="text" placeholder="Ingresa las ventas...">
                                        </div>
                                    </div>
                                </div>
                                <div class="column is-6">
                                    <div class="field">
                                        <label class="label">Fecha</label>
                                        <div class="control">
                                            <input class="input" type="date">
                                        </div>
                                    </div>
                                </div>
                                <div class="column is-6">
                                    <div class="field">
                                        <label class="label">Ingresos</label>
                                        <div class="control">
                                            <input class="input" type="number" placeholder="0.00">
                                        </div>
                                    </div>
                                </div>
                                <div class="column is-6">
                                    <div class="field">
                                        <label class="label">Egresos</label>
                                        <div class="control">
                                            <input class="input" type="number" placeholder="0.00">
                                        </div>
                                    </div>
                                </div>
                                <div class="column is-12">
                                    <div class="field">
                                        <label class="label">Concepto</label>
                                        <div class="control">
                                            <input class="input" type="text" placeholder="Escribe el concepto aquí">
                                        </div>
                                    </div>
                                </div>
                                <div class="column is-12">
                                    <div class="field">
                                        <label class="label">Valor</label>
                                        <div class="control">
                                            <input class="input is-link" type="number" placeholder="Valor final">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>
   <center> <div class="control">
    <a href="http://127.0.0.1:5500/Restaurante/index.html" class="button is-warning is-medium">
      Ir al inicio
    </a>
  </div>
  </center>
</div>
</body>
</html>
