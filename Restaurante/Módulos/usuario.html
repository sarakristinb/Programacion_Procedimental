<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Usuario</title>
</head>
<body>
<nav class="navbar is-warning" role="navigation" aria-label="main navigation">
      <div class="navbar-brand">
        <a class="navbar-item has-text-weight-bold"> Macdonitas </a>
      </div>

      <div id="navbarBasicExample" class="navbar-menu" color="#0091bd">
        <div class="navbar-start">
          <a class="navbar-item" href="../index.html"> Inicio </a>
          <a class="navbar-item" href="../Módulos/menu.html"> Menú </a>
          <a class="navbar-item" href="../Módulos/quienes_somos.html"> Quienes Somos </a>
          <a class="navbar-item" href="../Módulos/pedidos.html"> Pedidos </a>    
          <a class="navbar-item" href="../Módulos/usuario.html"> Usuario </a>
          <a class="navbar-item" href="../Módulos/contabilidad.html"> Contabilidad </a>  
        </div>
        </div>
      </div>
    </nav>

<section class="section">
    <div class="container">

        <div class="box">
            <h1 class="title is-3 has-text-centered">
                Registro de Usuario
            </h1>

            <p class="has-text-centered mb-5">
                Completa la siguiente información para continuar con tu registro.
            </p>

            <div class="field">
              <label class="label">Nombre</label>
              <div class="control">
                <input 
                  id="nombre_usuario"
                  class="input" 
                  type="text" 
                  placeholder="Escribe tu nombre"
                  required
                >
              </div>
            </div>

            <div class="field">
              <label class="label">Apellido</label>
              <div class="control has-icons-left has-icons-right">
                <input 
                  id="apellido_usuario"
                  class="input is-success" 
                  type="text"
                  placeholder="Escribe tu apellido"
                  required
                >
                <span class="icon is-small is-left">
                  <i class="fas fa-user"></i>
                </span>
                <span class="icon is-small is-right">
                  <i class="fas fa-check"></i>
                </span>
              </div>
            </div>

            <div class="field">
              <label class="label">Tipo de documento</label>
              <div class="control">
                <div class="select is-fullwidth">
                  <select name="tipo_documento_usuario" id="tipo_documento_usuario" required>
                    <option value="">Selecciona tipo de documento</option>
                    <option>Cédula ciudadania</option>
                    <option>Cédula extranjería</option>
                    <option>Pasaporte</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="field">
              <label class="label">Número de Documento</label>
              <div class="control has-icons-left has-icons-right">
                <input 
                  id="numero_documento_usuario"
                  class="input is-danger" 
                  type="number"
                  placeholder="Ingresa tu número de documento"
                  required
                >
                <span class="icon is-small is-left">
                  <i class="fas fa-id-card"></i>
                </span>
                <span class="icon is-small is-right">
                  <i class="fas fa-exclamation-triangle"></i>
                </span>
              </div>
            </div>

            <div class="field">
              <label class="label">Teléfono</label>
              <div class="control has-icons-left has-icons-right">
                <input 
                  id="telefono_usuario"
                  class="input is-danger" 
                  type="tel"
                  placeholder="Ejemplo: 3001234567"
                  required
                >
                <span class="icon is-small is-left">
                  <i class="fas fa-phone"></i>
                </span>
                <span class="icon is-small is-right">
                  <i class="fas fa-exclamation-triangle"></i>
                </span>
              </div>
            </div>

            <div class="field">
              <label class="label">Correo electrónico</label>
              <div class="control has-icons-left has-icons-right">
                <input 
                  id="correo_usuario"
                  class="input is-danger" 
                  type="email"
                  placeholder="correo@ejemplo.com"
                  required
                >
                <span class="icon is-small is-left">
                  <i class="fas fa-envelope"></i>
                </span>
                <span class="icon is-small is-right">
                  <i class="fas fa-exclamation-triangle"></i>
                </span>
              </div>
            </div>

            <div class="field">
              <label class="label">Género</label>
              <div class="control">
                <div class="select is-fullwidth">
                  <select name="genero_usuario" id="genero_usuario" required>
                    <option value="">Selecciona tu género</option>
                    <option>Femenino</option>
                    <option>Masculino</option>
                    <option>Otro</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="field">
              <label class="label">Cargo</label>
              <div class="control">
                <div class="select is-fullwidth">
                  <select name="cargo_usuario" id="cargo_usuario" required>
                    <option value="">Selecciona tu cargo</option>
                    <option>Chef</option>
                    <option>Mesero</option>
                    <option>Bartender</option>
                    <option>Administrador</option>
                    <option>Cajero</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="field">
              <label class="label">Fecha de Nacimiento</label>
              <div class="control has-icons-left has-icons-right">
                <input 
                  id="fecha_nacimiento_usuario"
                  class="input is-success" 
                  type="date"
                >
                <span class="icon is-small is-left">
                  <i class="fas fa-calendar"></i>
                </span>
                <span class="icon is-small is-right">
                  <i class="fas fa-check"></i>
                </span>
              </div>
            </div>

            <div class="field">
              <label class="label">Contraseña</label>
              <div class="control has-icons-left has-icons-right">
                <input 
                  id="contraseña_usuario"
                  class="input is-success" 
                  type="password"
                  placeholder="Crea una contraseña segura"
                  required
                >
                <span class="icon is-small is-left">
                  <i class="fas fa-lock"></i>
                </span>
                <span class="icon is-small is-right">
                  <i class="fas fa-check"></i>
                </span>
              </div>
            </div>

            <div class="field is-grouped is-justify-content-center mt-5">
              <div class="control">
                <button type="button" class="button is-warning is-medium" onclick="registrarUsuario(event)">
                  Enviar
                </button>
              </div>
              
              <div class="control">
                <button type="reset" class="button is-light is-medium">
                  Cancelar
                </button>
              </div>
            </div>

            <div class="field is-grouped is-justify-content-center mt-5">
              <div class="control">
                <a href="../index.html" class="button is-warning is-medium">
                  Ir al inicio
                </a>
              </div>
            </div>

        </div>
    </div>
</section>

  <script src="../js/usuario.js"></script>
</body>
</html>
